[Controls2D]
; 1 = SH2/SH3-style 2D movement at startup, 0 = SH4's original behaviour
enabled=1
; Virtual-key code of the on/off toggle (0x72 = F3)
toggle_key=0x72
; Beep when toggling
beep=1
; On a camera cut, keep walking the same way while the stick is held (SH2/SH3)
hold_on_cut=1
; Degrees the stick must move after a cut before the new camera takes over (SH2: 30)
release_angle=30
; A camera turn bigger than this in one frame counts as a cut (degrees)
cut_angle=20
; SH2-style turning: Henry turns straight to the stick direction instead of
; arcing (SH4 steers at 360 deg/s walking, 180 deg/s running). 0 = SH4's turning
snap_turn=1
; How fast his walking direction turns, degrees per second. 0 = instantly.
; (SH4: 1080 standing still, 360 walking, 180 running)
turn_speed=0
; How fast his body turns to face that direction, degrees per second.
; 0 = leave SH4's (690). Higher = snappier.
facing_speed=1440
; Stick dead zone (0..1)
deadzone=0.10
; Refuse to patch if the game code doesn't match the expected build
strict=1
; Log every cut and release (1) or just the first few hundred (0)
verbose_log=0
